name: Refresh Genshin game data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh the game-data snapshot
        run: node scripts/sync-genshin-catalog.mjs
      - name: Refresh the community build snapshot
        run: node scripts/sync-genshin-advisor.mjs
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- frontend/data/genshin-catalog.json frontend/data/genshin-research.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/genshin-catalog.json frontend/data/genshin-research.json
          git commit -m 'chore: refresh Genshin data snapshots'
          git push
