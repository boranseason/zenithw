map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_conn_zone $binary_remote_addr zone=zenithw_socket_per_ip:10m;
limit_req_zone $binary_remote_addr zone=zenithw_socket_handshake:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.zenithw.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zenithw.space;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    ssl_certificate /etc/ssl/cloudflare/api.zenithw.space.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.zenithw.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 95m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    limit_conn_status 429;
    limit_req_status 429;

    location /socket.io/ {
        limit_conn zenithw_socket_per_ip 12;
        limit_req zone=zenithw_socket_handshake burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
