map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.zenithw.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zenithw.space;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    ssl_certificate /etc/ssl/cloudflare/api.zenithw.space.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.zenithw.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 95m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
