[build]
  base = "frontend"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.zenithw.space wss://api.zenithw.space https://www.google-analytics.com https://region1.google-analytics.com; media-src 'self' blob:; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Versioned assets are immutable: a release changes the filename, so browsers
# can safely reuse these without revalidation. Unversioned HTML/version.js keep
# Netlify's default max-age=0,must-revalidate behavior.
[[headers]]
  for = "/app.8333ca441639.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/updates.308091c4bf66.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.11baf1c0d7fe.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
