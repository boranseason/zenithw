<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Remux — ZenithW</title>
<meta name="description" content="Medya dosyalarının konteynerini kayıpsız olarak değiştirin.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="zenithw.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.487d49f0164d.css">
<link rel="stylesheet" href="site-shell.css">
</head>
<body class="theme-default tool-page">
<main class="tool-page-main">
  <a class="tool-page-brand" href="/">ZenithW<span>.</span></a>
  <div class="remux-modal tool-modal tool-page-panel" aria-labelledby="remuxTitleTxt">
    <header class="tool-modal-header">
      <div class="tool-modal-heading">
        <span class="tool-modal-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg></span>
        <div><strong id="remuxTitleTxt">remux</strong><small id="remuxModalSub">konteyneri kayıpsız onar</small></div>
      </div>
      <button type="button" class="tool-modal-close" aria-label="Remux penceresini kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </header>
    <div class="tool-modal-body">
      <div class="dropzone" id="remuxDrop" onclick="document.getElementById('remuxFileInput').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleRemuxDrop(event)">
        <div class="tool-drop-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg></div>
        <div class="drop-title" id="remuxDropTitle">dosya sürükle veya seç</div><div class="drop-sub" id="remuxDropSub">mp4, webm, mp3, ogg, opus, wav, m4a</div>
        <input class="visually-hidden-input" type="file" id="remuxFileInput" accept=".mp4,.webm,.mkv,.avi,.mov,.mp3,.flac,.ogg,.opus,.wav,.m4a,video/*,audio/*" onchange="handleRemuxFile(this)"/>
      </div>
      <div class="remux-info">
        <div class="remux-info-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg><div id="remuxInfo1"><strong>remux ne yapar?</strong> dosya konteynerindeki sorunları düzeltir.</div></div>
        <div class="remux-info-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div id="remuxInfo2"><strong>kayıpsız:</strong> codec verisini yeni konteynere kopyalar.</div></div>
      </div>
    </div>
  </div>
</main>
<input id="urlInput" type="url" hidden aria-hidden="true"><textarea id="urlTextarea" hidden aria-hidden="true"></textarea>
<div id="siteBottomNav" data-active="remux"></div>
<div class="toast" id="toast"><div class="toast-dot" id="toastDot"></div><span id="toastTxt"></span></div>
<div class="overlay tone-neutral" id="saveOverlay" onclick="handleOverlay(event,'saveOverlay')">
  <div class="save-modal">
    <div class="handle"></div>
    <div class="save-title"><span>📥</span><span id="saveTitleTxt">nasıl kaydetmek istersin?</span></div>
    <div class="save-btns">
      <button class="save-btn" onclick="saveAction('download')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v13M5 16l7 5 7-5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="saveDlTxt">indir</span></button>
      <button class="save-btn" onclick="saveAction('share')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg><span id="saveShareTxt">paylaş</span></button>
      <button class="save-btn" onclick="saveAction('copy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg><span id="saveCopyTxt">kopyala</span></button>
    </div>
    <div class="save-note" id="saveNoteTxt">tarayıcı pop-up'ları engelliyorsa "indir" butonunu kullanın.</div>
    <button class="save-done" onclick="closeOverlay('saveOverlay')" id="saveDoneTxt">tamam</button>
  </div>
</div>
<script src="app.d4596317c4a7.js"></script>
<script src="site-shell.js"></script>
</body>
</html>
