        updated: 'Son güncelleme: 17 Ağustos 2026',
        body: `
          <section class="info-section">
            <h2>Basit görünür, ciddi çalışır.</h2>
            <p>Bir bağlantı yapıştırırsın; ZenithW uygun akışları bulur, seçtiğin kaliteyi hazırlar ve dosyayı tarayıcına iletir. Üyelik, sahte indirme düğmeleri veya reklam yönlendirmeleri yoktur.</p>
            <div class="feature-grid">
              <div class="mini-card"><span class="mini-card-number">01</span><h3>Temiz</h3><p>Reklamsız, doğrudan ve gereksiz adımlardan uzak.</p></div>

            <p>Merak edenler projenin arka plan mimarisini, güvenlik yaklaşımını ve güncel geliştirme sürecini doğrudan GitHub üzerinden inceleyebilir.</p>
            <div class="cta-row">
              <a class="info-button primary" href="https://github.com/kakangeldi82-netizen/zenithw" target="_blank" rel="noopener noreferrer">GitHub'da incele ↗</a>

            </div>
          </section>
          <section class="info-section">
            <h2>Proje bilgileri</h2>
            <div class="project-grid">
              <div class="mini-card"><span class="project-label">geliştirici</span><span class="project-value"><a href="https://www.instagram.com/boranseason" target="_blank" rel="noopener noreferrer">@boranseason</a></span></div>
              <div class="mini-card"><span class="project-label">lisans</span><span class="project-value">MIT</span></div>
              <div class="mini-card"><span class="project-label">iletişim</span><span class="project-value"><a href="mailto:info@zenithw.space">info@zenithw.space</a></span></div>
              <div class="mini-card"><span class="project-label">yaklaşım</span><span class="project-value">bağımsız & açık kaynak</span></div>
            </div>
          </section>`,
        footer: '<a href="/privacy.html">gizlilik</a><a href="/terms.html">kullanım koşulları</a><a href="/dmca.html">telif</a><a href="/status.html">durum</a><a href="/thanks.html">teşekkürler</a>'
      },
      en: {
        title: 'About — ZenithW',
        desc: 'ZenithW: an ad-free, open-source media tool that turns a link into a clean downloadable file.',
        back: '← home',
        kicker: 'open source · ad-free',
        h1: 'Drop the link.<br>ZenithW handles the rest.',
        lead: 'ZenithW is an independent web tool that turns video and audio links into downloadable files without unnecessary redirects.',
        updated: 'Last updated: August 17, 2026',
        body: `
          <section class="info-section">
            <h2>Simple outside. Serious underneath.</h2>
            <p>Paste a link and ZenithW finds the available streams, prepares your chosen quality, and delivers the file to your browser. No account, fake download buttons, or ad redirects.</p>
            <div class="feature-grid">
              <div class="mini-card"><span class="mini-card-number">01</span><h3>Clean</h3><p>Ad-free, direct, and stripped of unnecessary steps.</p></div>
              <div class="mini-card"><span class="mini-card-number">02</span><h3>Temporary</h3><p>Processing files are not kept as a permanent archive.</p></div>
              <div class="mini-card"><span class="mini-card-number">03</span><h3>Open</h3><p>The source code and development process are visible on GitHub.</p></div>
            </div>
          </section>
          <section class="info-section">
            <h2>What's behind it?</h2>
            <p>ZenithW brings together open-source tools such as Python, Flask, yt-dlp, FFmpeg, and Socket.IO. Format discovery, remuxing, conversion, queues, and temporary-file cleanup are handled behind the interface.</p>
            <p>Anyone curious can inspect the backend architecture, security approach, and current development process directly on GitHub.</p>
            <div class="cta-row">
              <a class="info-button primary" href="https://github.com/kakangeldi82-netizen/zenithw" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
              <a class="info-button" href="mailto:info@zenithw.space">get in touch</a>
            </div>
          </section>
          <section class="info-section">
            <h2>Project details</h2>
            <div class="project-grid">
              <div class="mini-card"><span class="project-label">developer</span><span class="project-value"><a href="https://www.instagram.com/boranseason" target="_blank" rel="noopener noreferrer">@boranseason</a></span></div>
              <div class="mini-card"><span class="project-label">license</span><span class="project-value">MIT</span></div>
              <div class="mini-card"><span class="project-label">contact</span><span class="project-value"><a href="mailto:info@zenithw.space">info@zenithw.space</a></span></div>
              <div class="mini-card"><span class="project-label">approach</span><span class="project-value">independent & open source</span></div>
            </div>
          </section>`,
        footer: '<a href="/privacy.html">privacy</a><a href="/terms.html">terms</a><a href="/dmca.html">copyright</a><a href="/status.html">status</a><a href="/thanks.html">thanks</a>'
      }
    };

    function setPageLang(lang) {
      const active = COPY[lang] ? lang : 'en';
      const text = COPY[active];
      document.documentElement.lang = active;
      document.getElementById('pgTitle').textContent = text.title;
      document.getElementById('pgDesc').setAttribute('content', text.desc);
      document.getElementById('pgBack').textContent = text.back;
      document.getElementById('pgKicker').textContent = text.kicker;
      document.getElementById('pgH1').innerHTML = text.h1;
      document.getElementById('pgLead').textContent = text.lead;
      document.getElementById('pgUpdated').textContent = text.updated;
      document.getElementById('pgBody').innerHTML = text.body;
      document.getElementById('pgFooter').innerHTML = text.footer;
      document.querySelectorAll('#langSwitch button').forEach(button => button.classList.toggle('active', button.dataset.lang === active));
      try { localStorage.setItem('zw_lang', active); } catch (_) {}
    }

    let savedLanguage = 'tr';
    try { savedLanguage = localStorage.getItem('zw_lang') || 'tr'; } catch (_) {}
    setPageLang(savedLanguage === 'tr' ? 'tr' : 'en');
  </script>
